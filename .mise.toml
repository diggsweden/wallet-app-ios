[settings]
experimental = true

[env]
HTTP_PROXY = "{{ get_env(name='HTTP_PROXY', default='') }}"
HTTPS_PROXY = "{{ get_env(name='HTTPS_PROXY', default='') }}"
NO_PROXY = "{{ get_env(name='NO_PROXY', default='') }}"
http_proxy = "{{ get_env(name='http_proxy', default='') }}"
https_proxy = "{{ get_env(name='https_proxy', default='') }}"
no_proxy = "{{ get_env(name='no_proxy', default='') }}"
PIP_INDEX_URL = "{{ get_env(name='PIP_INDEX_URL', default='') }}"

[tools]
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }
"aqua:casey/just" = "1.58.0"
"aqua:rhysd/actionlint" = "v1.7.12"
"forgejo:itiquette/gommitlint" = "0.9.11"
"aqua:zricethezav/gitleaks" = "v8.30.1"
"aqua:rvben/rumdl" = "v0.2.63"
"aqua:koalaman/shellcheck" = "v0.11.0"
"aqua:mvdan/sh" = "v3.14.0"
"aqua:google/yamlfmt" = "v0.21.0"
"pipx:reuse" = "6.2.0"
"aqua:realm/SwiftLint" = { version = "0.65.1", os = ["macos"] }
"http:screenshotbot-recorder" = { version = "2.18.15", url = "https://cdn.screenshotbot.io/artifact/releases/{{version}}/recorder-darwin", checksum = "sha256:5d4badcab5ef25357757ce1e6e6edb561eedaffd1fafa143cb00c375dd7fc6a6", os = ["macos"] }
