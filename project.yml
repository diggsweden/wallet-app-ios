name: Wallet

options:
  deploymentTarget:
    iOS: "17.6"
  createIntermediateGroups: true
  preGenCommand: ./scripts/setup-configuration.sh

configFiles:
  Debug: Configurations/Config-Debug.xcconfig
  Release: Configurations/Config-Release.xcconfig
  Debug Localhost: Configurations/Config-Localhost.xcconfig

fileGroups:
  - path: Configurations
    excludes:
      - "*.example"
  - README.md
  - CHANGELOG.md
  - project.yml

configs:
  Debug: debug
  Release: release
  Debug Localhost: debug

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.12
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      COPY_PHASE_STRIP: NO
    Debug Localhost:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES

packages:
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI.git
    exactVersion: 3.1.4
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    exactVersion: 0.15.0
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.19.4
  WalletMacros:
    path: Packages/WalletMacros
  WalletGateway:
    path: Packages/WalletGatewayApi/WalletGateway
    group: Packages/WalletGatewayApi
  WalletGatewayInterface:
    path: Packages/WalletGatewayApi/WalletGatewayInterface
    group: Packages/WalletGatewayApi
  SwiftAccessMechanism:
    url: https://github.com/diggsweden/SwiftAccessMechanism.git
    branch: chore/spm-vendored-xcframework
  DesignSystem:
    path: Packages/DesignSystem
  CredentialInterfaces:
    path: Packages/CredentialInterfaces
  User:
    path: Packages/User
  WalletNetworking:
    path: Packages/WalletNetworking
  Jose:
    path: Packages/Jose
  SdJwtClaims:
    path: Packages/SdJwtClaims

  OpenId4VCInterface:
    path: Packages/OpenId4VCInterface
  Presentation:
    path: Packages/Presentation
  Issuance:
    path: Packages/Issuance
targets:
  WalletDemo:
    type: application
    platform: iOS
    sources:
      - path: Wallet
        excludes:
          - WalletDemo-Info.plist
    settings:
      base:
        DEVELOPMENT_TEAM: R5MUUW7M24
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: Wallet/WalletDemo-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: se.digg.wallet.demo
        PRODUCT_NAME: WalletDemo
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDemo
        Debug Localhost:
          CODE_SIGN_STYLE: Automatic
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconLocal
    dependencies:
      - package: WalletMacros
        product: WalletMacros
      - package: WalletGateway
        product: WalletGateway
      - package: WalletGatewayInterface
        product: WalletGatewayInterface
      - package: SwiftAccessMechanism
        product: SwiftAccessMechanism
      - package: SDWebImageSwiftUI
        product: SDWebImageSwiftUI
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - package: DesignSystem
        product: DesignSystem
      - package: CredentialInterfaces
        product: CredentialInterfaces
      - package: User
        product: User
      - package: WalletNetworking
        product: WalletNetworking
      - package: Jose
        product: Jose
      - package: SdJwtClaims
        product: SdJwtClaims
      - package: OpenId4VCInterface
        product: OpenId4VCInterface
      - package: Presentation
        product: Presentation
      - package: Issuance
        product: Issuance
    preBuildScripts:
      - name: SwiftLint
        path: scripts/swiftlint.sh
        basedOnDependencyAnalysis: false

  WalletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.4"
    sources: WalletTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R5MUUW7M24
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.digg.walletTests
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WalletDemo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WalletDemo"
    dependencies:
      - target: WalletDemo
      - package: WalletMacros
        product: WalletMacros

  WalletSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: WalletSnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R5MUUW7M24
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.digg.walletSnapshotTests
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WalletDemo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WalletDemo"
    dependencies:
      - target: WalletDemo
      - package: swift-snapshot-testing
        product: SnapshotTesting

  WalletUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.4"
    sources: WalletUITests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R5MUUW7M24
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.digg.walletUITests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: WalletDemo
    dependencies:
      - target: WalletDemo

schemes:
  Wallet Demo:
    build:
      targets:
        WalletDemo: all
    test:
      targets:
        - WalletTests
        - WalletUITests

  Wallet Demo Localhost:
    build:
      targets:
        WalletDemo: all
    run:
      config: Debug Localhost
    test:
      config: Debug Localhost
      targets:
        - WalletTests
        - WalletUITests
    analyze:
      config: Debug Localhost

  WalletTests:
    build:
      targets:
        WalletTests: test
    test:
      gatherCoverageData: true
      coverageTargets:
        - WalletDemo
      targets:
        - WalletTests

  WalletSnapshotTests:
    build:
      targets:
        WalletSnapshotTests: test
    test:
      targets:
        - WalletSnapshotTests

  WalletSnapshotTests Screenshotbot:
    build:
      targets:
        WalletSnapshotTests: test
    test:
      environmentVariables:
        SCREENSHOTBOT: "1"
      targets:
        - WalletSnapshotTests

  PackageTests:
    build:
      targets:
        WalletDemo: none
    test:
      targets:
        - package: WalletGateway/WalletGatewayTests
        - package: WalletNetworking/WalletNetworkingTests
        - package: Jose/JoseTests
        - package: SdJwtClaims/SdJwtClaimsTests
        - package: OpenId4VCInterface/OpenId4VCInterfaceTests
        - package: Presentation/PresentationTests
        - package: Issuance/IssuanceTests

