name: Screenshots Noop

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "LICENSES/**"
      - "WalletTests/**"
      - "WalletUITests/**"
      - "**.md"
      - "justfile"
      - ".mise.toml"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".gommitlint.yaml"
      - ".semgrepignore"
      - ".swift-format"
      - ".swiftlint.yml"
      - ".yamlfmt.yml"
      - "CODEOWNERS"
      - "REUSE.toml"
      - "renovate.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No files affecting snapshots changed, skipping"
      - run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context="Screenshotbot Changes: wallet-app-ios" \
            -f description="No screenshot-affecting changes"
        env:
          GH_TOKEN: ${{ github.token }}
