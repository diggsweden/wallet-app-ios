name: Release Workflow

# Triggers on release tags - creates GitHub Release with IPA and uploads to TestFlight
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-number:
    uses: ./.github/workflows/compute-build-number.yml
    permissions:
      contents: read

  generate-artifacts-config:
    needs: build-number
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.generate.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate artifacts config with build number
        id: generate
        env:
          BUILD_NUMBER: ${{ needs.build-number.outputs.value }}
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
          MACOS_VERSION: ${{ vars.MACOS_VERSION }}
        run: |
          {
            echo "config<<GITHUB_OUTPUT_EOF"
            # shellcheck disable=SC2016 # envsubst needs the literal variable names
            envsubst '${BUILD_NUMBER} ${XCODE_VERSION} ${MACOS_VERSION}' < .github/artifacts-config-template.yml
            echo "GITHUB_OUTPUT_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: generate-artifacts-config
    uses: diggsweden/reusable-ci/.github/workflows/release-orchestrator.yml@997d7dc2238b40c79798fda309d8061b0707a3e5 # v3.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
      pull-requests: read
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      AUTHORIZED_RELEASE_DEVELOPERS: ${{ secrets.AUTHORIZED_RELEASE_DEVELOPERS }}
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSPHRASE: ${{ secrets.CERTIFICATE_PASSPHRASE }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
    with:
      reusable-ci-ref: 997d7dc2238b40c79798fda309d8061b0707a3e5
      artifacts-config: ${{ needs.generate-artifacts-config.outputs.config }}
      release-publisher: github-cli
      release.attachartifacts: |
        build/export/*.ipa
      release.signartifacts: false

